<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <!-- Top Green Gradient -->
    <linearGradient id="topGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ED544" />
      <stop offset="50%" stop-color="#9EE04C" />
      <stop offset="100%" stop-color="#B5EB65" />
    </linearGradient>

    <!-- Accent Curved Stroke Gradient -->
    <linearGradient id="curveGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#62B82F" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#B5EB65" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Palm/Feather Leaf Pattern for Bottom -->
    <pattern id="leafPattern" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 0 100 Q 50 20 100 100 T 200 100" fill="none" stroke="#80B8D0" stroke-opacity="0.15" stroke-width="1.5" />
      <path d="M 0 120 Q 50 40 100 120 T 200 120" fill="none" stroke="#80B8D0" stroke-opacity="0.12" stroke-width="1.5" />
      <path d="M 0 140 Q 50 60 100 140 T 200 140" fill="none" stroke="#80B8D0" stroke-opacity="0.1" stroke-width="1.5" />
      <path d="M 0 80 Q 50 0 100 80 T 200 80" fill="none" stroke="#80B8D0" stroke-opacity="0.12" stroke-width="1.5" />
      <path d="M 100 0 Q 150 80 200 0" fill="none" stroke="#80B8D0" stroke-opacity="0.15" stroke-width="1.5" />
      <path d="M 100 20 Q 150 100 200 20" fill="none" stroke="#80B8D0" stroke-opacity="0.12" stroke-width="1.5" />
      <path d="M 100 40 Q 150 120 200 40" fill="none" stroke="#80B8D0" stroke-opacity="0.1" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1200" fill="#FBFBFA" />

  <!-- Bottom Textured Area with Leaf Motif -->
  <rect y="550" width="800" height="650" fill="url(#leafPattern)" />

  <!-- Flowing background decorative curves in bottom section -->
  <path d="M -50 650 Q 200 780 850 480 L 850 1250 L -50 1250 Z" fill="#F6FBF6" opacity="0.6" />

  <!-- Secondary Accent Curve 1 -->
  <path d="M -50 780 Q 250 820 850 410" fill="none" stroke="#69BA33" stroke-width="14" opacity="0.5" />

  <!-- Secondary Accent Curve 2 -->
  <path d="M -50 720 Q 250 790 850 430" fill="none" stroke="#A5E358" stroke-width="22" />

  <!-- Main Top Section (Smooth Curved Green Dome) -->
  <path d="M -50 -50 L 850 -50 L 850 410 Q 250 770 -50 700 Z" fill="url(#topGradient)" />

  <!-- Soft shadow underneath top section -->
  <path d="M -50 705 Q 250 775 850 415" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="8" filter="blur(4px)" />

  <!-- Title Section: 'أخلاق الباحث المسلم' -->
  <text 
    x="400" 
    y="370" 
    font-family="'Noto Sans Arabic', 'Amiri', 'Tajawal', 'Cairo', 'Traditional Arabic', sans-serif" 
    font-size="56" 
    font-weight="800" 
    fill="#FFFFFF" 
    text-anchor="middle"
    letter-spacing="0.5"
    filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.12))"
  >أخلاق الباحث المسلم</text>

  <!-- Title Section: 'المعاصر' -->
  <text 
    x="400" 
    y="460" 
    font-family="'Noto Sans Arabic', 'Amiri', 'Tajawal', 'Cairo', 'Traditional Arabic', sans-serif" 
    font-size="56" 
    font-weight="800" 
    fill="#FFFFFF" 
    text-anchor="middle"
    letter-spacing="0.5"
    filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.12))"
  >المعاصر</text>

  <!-- Author Line at Bottom: 'من تأليف : أيمن كناني' -->
  <g transform="translate(400, 1100)">
    <text 
      x="0" 
      y="0" 
      font-family="'Amiri', 'Noto Naskh Arabic', 'Traditional Arabic', 'Cairo', serif" 
      font-size="38" 
      font-weight="bold" 
      fill="#1C1B19" 
      text-anchor="middle"
      letter-spacing="1"
    >من تأليف : أيمن كناني</text>
  </g>

</svg>